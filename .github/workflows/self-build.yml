name: Self Build (Linux Server + macOS Desktop)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version string (empty = <base>-preview.<UTC date>.<run>)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish GitHub Release on this fork"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: self-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build JS bundle (telemetry-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Checkout (exclude .repos)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          rm -f .env .env.local

      - name: Resolve build version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base_ver="$(jq -r '.version' apps/server/package.json)"
          if [[ -n "$INPUT_VERSION" ]]; then
            ver="$INPUT_VERSION"
          else
            ver="${base_ver}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: $ver (commit ${GITHUB_SHA})"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.meta.outputs.version }}"

      - name: Build JS bundle
        shell: bash
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
          T3CODE_TELEMETRY_ENABLED: "false"
        run: |
          set -euo pipefail
          rm -f .env .env.local
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          if [[ "$script" == "build:desktop" ]]; then
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
          fi
          vp run "$script"

      - name: Verify no production telemetry or Clerk keys baked into bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'us-east-1\.aws\.edge\.axiom\.co|xaat-|pk_live_Y2xlcmsudDMuY29kZXMk' apps/server/dist apps/desktop/dist-electron; then
            echo "::error::Unexpected production Axiom/Clerk token found in compiled JS bundle"
            exit 1
          fi

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  linux_server:
    name: Build Linux x64 Server (2.8)
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (exclude .repos)
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.bundle.outputs.commit }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          rm -f .env .env.local

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=self-stage-pnpm-v1-linux-x64-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        shell: bash
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.bundle.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Apply web client branding
        shell: bash
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        shell: bash
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
          T3CODE_TELEMETRY_ENABLED: "false"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Package Linux CLI archive
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
        run: |
          node scripts/build-cli-archive.ts             --platform linux             --arch x64             --version "${{ needs.bundle.outputs.version }}"             --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"             --output-dir release-cli

      - name: Smoke-test Linux CLI archive & verify zero baked telemetry tokens
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "${{ needs.bundle.outputs.version }}"
          chk_dir="$(mktemp -d)"
          tar -xzf release-cli/*.tar.gz -C "$chk_dir"
          if grep -raoE 'us-east-1\.aws\.edge\.axiom\.co|xaat-|pk_live_Y2xlcmsudDMuY29kZXMk' "$chk_dir"; then
            echo "::error::Unexpected production Axiom/Clerk token found in Linux server archive"
            exit 1
          fi
          rm -rf "$chk_dir"

      - name: Save staged install cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Linux x64 server archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos_desktop:
    name: Build macOS arm64 Desktop (Mac mini)
    needs: bundle
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout (exclude .repos)
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.bundle.outputs.commit }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          rm -f .env .env.local

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=self-stage-pnpm-v1-mac-arm64-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        shell: bash
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ needs.bundle.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Build unsigned macOS arm64 desktop DMG & ZIP
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          node scripts/build-desktop-artifact.ts             --platform mac             --target dmg             --arch arm64             --build-version "${{ needs.bundle.outputs.version }}"             --skip-build             --verbose

      - name: Smoke-test packaged macOS app
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/desktop-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls "$GITHUB_WORKSPACE"/release/*.dmg)"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(ls -d "$mount"/*.app)
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"

      - name: Save staged install cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload macOS arm64 desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish_release:
    name: Publish Self-Maintained Release
    needs: [bundle, linux_server, macos_desktop]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-assets
          merge-multiple: true

      - name: Generate SHA256SUMS and create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
          COMMIT_SHA: ${{ needs.bundle.outputs.commit }}
        run: |
          set -euo pipefail
          cd dist-assets
          ls -lh
          sha256sum t3-*.tar.gz T3-Code-*.dmg T3-Code-*.zip > SHA256SUMS
          cat SHA256SUMS
          tag="v${VERSION}"
          notes="Self-built from audited branch \`maintained\` (\`${COMMIT_SHA}\`). Zero baked-in Axiom/Clerk/Relay production tokens."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS t3-*.tar.gz T3-Code-*.dmg T3-Code-*.zip
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$COMMIT_SHA" --title "$tag" --prerelease --notes "$notes" SHA256SUMS t3-*.tar.gz T3-Code-*.dmg T3-Code-*.zip
          fi
